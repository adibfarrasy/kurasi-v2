# Development Fly app. Build context is the monorepo root — deploy from repo root, e.g.
#   flyctl deploy . --config backend/fly.development.toml --remote-only
#
# See https://fly.io/docs/reference/configuration/

app = 'kurasi-development'
primary_region = 'sin'

[build]
dockerfile = 'backend/Dockerfile'

[http_service]
internal_port = 8989
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 512
