# Skaffold configuration for local development
#
# Usage:
#   skaffold dev    # Brings up Postgres + Mailpit
#
# OrbStack Kubernetes: Local images are immediately available to pods
# without pushing to a registry (https://docs.orbstack.dev/kubernetes/)
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: kurasi

manifests:
  rawYaml:
    - mailpit/*.yaml

deploy:
  kubeContext: orbstack
  kubectl: {}
  helm:
    releases:
      # Postgres
      - name: db
        repo: https://charts.bitnami.com/bitnami
        remoteChart: postgresql
        namespace: kurasi
        createNamespace: true
        setValues:
          auth.postgresPassword: postgres

portForward:
  - resourceType: service
    resourceName: mailpit
    namespace: kurasi
    port: 1025 # SMTP
    localPort: 1027
  - resourceType: service
    resourceName: mailpit
    namespace: kurasi
    port: 8025 # Web UI + API
    localPort: 8027
  - resourceType: statefulset
    resourceName: db-postgresql
    namespace: kurasi
    port: 5432
    localPort: 5437
