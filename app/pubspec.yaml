name: kurasi
description: Kurasi wardrobe app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  flutter_web_auth_2: ^5.1.0
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: FunnelSans
      fonts:
        - asset: assets/fonts/FunnelSans-Regular.ttf
        - asset: assets/fonts/FunnelSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/FunnelSans-Bold.ttf
          weight: 700
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: KirangHaerang
      fonts:
        - asset: assets/fonts/KirangHaerang-Regular.ttf
  assets:
    - assets/bookmark-simple.png
    - assets/dresser.png
    - assets/logomark.png
    - assets/logomark@2x.png
    - assets/logomark@3x.png
    - assets/mannequin.png
    - assets/onboarding-credits-bl-denim-jacket.png
    - assets/onboarding-credits-br-models-pair.png
    - assets/onboarding-credits-center.png
    - assets/onboarding-credits-tl-coat-man.png
    - assets/onboarding-credits-tr-loafers.png
    - assets/plus-button.png
    - assets/smiley-face.png
    - assets/sparkle.png
    - assets/splash.png
    - assets/splash@2x.png
    - assets/splash@3x.png
    - assets/test-face.png
    - assets/top-flair.png
    - assets/underline.png