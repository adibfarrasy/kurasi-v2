version: v1.1.0
dsn: postgres://postgres:postgres@db:5433/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
  admin:
    base_url: http://localhost:4434/

selfservice:
  default_browser_return_url: kurasi://callback
  allowed_return_urls:
    - kurasi://callback
  flows:
    login:
      ui_url: http://localhost:3000/login
    error:
      ui_url: http://localhost:3000/error
    settings:
      ui_url: http://localhost:3000/settings
    recovery:
      enabled: false
    verification:
      enabled: false
  methods:
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: ${GOOGLE_CLIENT_ID}
            client_secret: ${GOOGLE_CLIENT_SECRET}
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - openid
              - email
              - profile
    password:
      enabled: false

log:
  level: info

secrets:
  cookie:
    - ${KRATOS_COOKIE_SECRET}
  cipher:
    - ${KRATOS_CIPHER_SECRET}

session:
  lifespan: 168h
  cookie:
    path: /
    same_site: Lax
  whoami:
    tokenizer:
      templates:
        api:
          ttl: 10m
          jwks_url: file:///etc/config/kratos/jwk.json
          claims_mapper_url: file:///etc/config/kratos/claims.jsonnet

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
