# https://taskfile.dev

version: "3"

silent: true

env:
  WARP_USE_SSH_WRAPPER: "0"

tasks:
  app-dev:
    desc: Run the Flutter app
    dir: app
    cmds:
      - flutter run

  app-analyze:
    desc: Analyze the Flutter app
    dir: app
    cmds:
      - flutter analyze

  app-test:
    desc: Run Flutter tests
    dir: app
    cmds:
      - flutter test

  be-infra:
    desc: Run local Postgres + Mailpit
    dir: backend
    cmds:
      - docker compose up

  be-dev:
    desc: Rebuild + run backend
    dir: backend
    cmds:
      - cargo run

  be-build:
    desc: Build backend release binary
    dir: backend
    cmds:
      - cargo build --release

  be-lint:
    desc: Lint backend (clippy)
    dir: backend
    cmds:
      - cargo clippy --all-targets -- -D warnings

  be-test:
    desc: Run backend tests (needs local Postgres)
    dir: backend
    env:
      DATABASE_URL: "{{.DATABASE_URL | default \"postgresql://postgres:postgres@127.0.0.1:5437/postgres\"}}"
    cmds:
      - cargo test

  db-migrate:local:
    desc: Apply sqlx migrations to local DB
    dir: backend
    env:
      DATABASE_URL: "{{.DATABASE_URL | default \"postgresql://postgres:postgres@127.0.0.1:5437/postgres\"}}"
    cmds:
      - sqlx migrate run --source ./migrations

  reset-db:local:
    desc: Reset local DB (remove Postgres volume, recreate stack, run migrations)
    dir: backend
    cmds:
      - docker compose down -v
      - docker compose up -d
      - bash -c 'until docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1; do sleep 0.5; done'
      - task db-migrate:local

  ci:
    desc: Run all CI checks (app + backend)
    cmds:
      - task: app-analyze
      - task: app-test
      - task: be-lint
      - task: be-test