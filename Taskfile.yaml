# https://taskfile.dev

version: "3"

silent: true

env:
  WARP_USE_SSH_WRAPPER: "0"

tasks:
  app-dev:
    dir: app
    cmds:
      - bun run start

  be-dev:
    desc: Run backend development
    dir: backend
    cmds:
      - bun run dev

  be-infra:
    desc: Run backend infrastructure
    dir: backend
    cmds:
      - docker compose up

  # Better Auth schema -> Drizzle schema (auth-schema.ts)
  generate-auth-schema:
    desc: Generate Better Auth schema
    dir: backend
    cmds:
      - bunx --bun --env-file=.env.development.local @better-auth/cli generate
        --config ./auth.ts --output ./db/auth-schema.gen.ts --yes
      - task lint

  # Drizzle schema -> SQL migrations
  drizzle-generate:
    desc: Generate Drizzle migrations
    dir: backend
    cmds:
      - bun --env-file=.env.development.local drizzle-kit generate

  # Apply SQL migrations to the local DB
  drizzle-migrate:local:
    desc: Run Drizzle migrations locally
    dir: backend
    cmds:
      - bun --env-file=.env.development.local drizzle-kit migrate

  reset-db:local:
    desc: Reset local DB (remove Postgres volume, recreate stack, run migrations)
    dir: backend
    cmds:
      - docker compose down -v
      - docker compose up -d
      - bash -c 'until docker compose exec -T db pg_isready -U postgres
        >/dev/null 2>&1; do sleep 0.5; done'
      - task drizzle-migrate:local

  app-build:ios:
    desc: Build iOS dev client via EAS Build
    dir: app
    cmds:
      - bun run build:ios -- --non-interactive

  app-build:ios-simulator:
    desc: Build iOS simulator dev client via EAS Build
    dir: app
    cmds:
      - bun run build:ios:simulator -- --non-interactive

  # Lint
  lint:
    desc: Run Biome linter
    cmds:
      - bun lint

  typecheck:
    desc: Run type checker
    cmds:
      - bun --workspaces run typecheck

  test:
    desc: Run tests
    cmds:
      - bun test

  ci:
    desc: Run all CI checks (lint, typecheck, test)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
