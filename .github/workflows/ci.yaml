name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - run: bun install --frozen-lockfile

      - run: bunx biome ci

      - run: task typecheck

      - run: task test
