# https://taskfile.dev

version: "3"

silent: true

env:
  WARP_USE_SSH_WRAPPER: "0"

tasks:
  app-dev:
    dir: app
    cmds:
      - bun run start

  ios-clean-prebuild:
    dir: app
    cmds:
      - npx expo prebuild -p ios --clean

  ios-dev:
    dir: app
    cmds:
      - bun run ios

  ios-dev-device:
    dir: app
    cmds:
      - bun run ios:device

  be-infra:
    desc: Run local Postgres + Mailpit
    dir: backend
    cmds:
      - docker compose up

  be-dev:
    desc: Rebuild + run backend
    dir: backend
    cmds:
      - cargo run

  be-build:
    desc: Build backend release binary
    dir: backend
    cmds:
      - cargo build --release

  be-lint:
    desc: Lint backend (clippy)
    dir: backend
    cmds:
      - cargo clippy --all-targets -- -D warnings

  be-test:
    desc: Run backend tests (needs local Postgres)
    dir: backend
    env:
      DATABASE_URL: "{{.DATABASE_URL | default \"postgresql://postgres:postgres@127.0.0.1:5437/postgres\"}}"
    cmds:
      - cargo test

  db-migrate:local:
    desc: Apply sqlx migrations to local DB
    dir: backend
    env:
      DATABASE_URL: "{{.DATABASE_URL | default \"postgresql://postgres:postgres@127.0.0.1:5437/postgres\"}}"
    cmds:
      - sqlx migrate run --source ./migrations

  reset-db:local:
    desc: Reset local DB (remove Postgres volume, recreate stack, run migrations)
    dir: backend
    cmds:
      - docker compose down -v
      - docker compose up -d
      - bash -c 'until docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1; do sleep 0.5; done'
      - task db-migrate:local

  deploy-testflight:
    desc: Deploy to TestFlight
    dir: app
    cmds:
      - bunx testflight

  app-build:ios:
    desc: Build iOS dev client via EAS Build
    dir: app
    cmds:
      - bun run build:ios -- --non-interactive

  app-build:ios-simulator:
    desc: Build iOS simulator dev client via EAS Build
    dir: app
    cmds:
      - bun run build:ios:simulator -- --non-interactive

  app-build:android:
    desc: Build Android APK locally (preview profile) → app/kurasi-preview.apk
    dir: app
    cmds:
      - bun run build:android -- --non-interactive

  # Lint
  lint:
    desc: Run Biome linter (app)
    cmds:
      - bun lint

  typecheck:
    desc: Run type checker (app)
    cmds:
      - bun --workspaces run typecheck

  test:
    desc: Run tests (app)
    cmds:
      - bun test

  ci:
    desc: Run all CI checks (app + backend)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: be-lint
      - task: be-test